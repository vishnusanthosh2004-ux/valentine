<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
background:#ffd6e7;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
font-family:Arial;
}

.container{
position:relative;
text-align:center;
}

.bunny{
width:140px;
position:absolute;
top:-150px;
left:50%;
transform:translateX(-50%);
animation:sway 1.5s infinite alternate;
}

@keyframes sway{
from{transform:translateX(-50%) rotate(-6deg)}
to{transform:translateX(-50%) rotate(6deg)}
}

.box{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 6px 18px rgba(0,0,0,.2);
min-width:300px;
position:relative;
}

.question{
font-size:26px;
margin-bottom:12px;
}

.bubble{
background:#fff0f6;
border:2px solid #d81b60;
border-radius:15px;
padding:10px;
margin-bottom:18px;
color:#d81b60;
font-size:18px;
min-height:28px;
}

.buttons{
display:flex;
justify-content:center;
gap:20px;
}

button{
font-size:20px;
padding:12px 32px;
border-radius:15px;
border:none;
cursor:pointer;
transition:transform .3s ease;
}

#yesBtn{
background:#d81b60;
color:white;
}

#noBtn{
background:gray;
color:white;
position:fixed;
}

.celebration{
position:fixed;
inset:0;
background:#ffd6e7;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;
}

.love{
font-size:60px;
color:#d81b60;
animation:glow 1.2s infinite alternate;
margin-top:20px;
}

@keyframes glow{
from{ text-shadow:0 0 10px #ff5fa2;}
to{ text-shadow:0 0 35px #ff2f85;}
}

.firework{
position:absolute;
font-size:40px;
animation:explode 1.2s ease-out forwards;
}

@keyframes explode{
0%{transform:translate(0,0);opacity:1}
