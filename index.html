<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
background:#ffd6e7;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
overflow:hidden;
}

.container{
position:relative;
}

.bunny{
width:120px;
height:120px;
background:#ffb6c1;
border-radius:50%;
position:absolute;
top:-140px;
left:50%;
transform:translateX(-50%);
animation:sway 1.5s infinite alternate;
display:flex;
justify-content:center;
align-items:center;
font-size:60px;
}

@keyframes sway{
from{transform:translateX(-50%) rotate(-6deg)}
to{transform:translateX(-50%) rotate(6deg)}
}

.box{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 6px 18px rgba(0,0,0,.2);
min-width:300px;
text-align:center;
}

.question{
font-size:26px;
margin-bottom:12px;
}

.bubble{
background:#fff0f6;
border:2px solid #d81b60;
border-radius:15px;
padding:10px;
margin-bottom:18px;
color:#d81b60;
font-size:18px;
min-height:28px;
}

.buttons{
display:flex;
justify-content:center;
gap:20px;
}

button{
font-size:20px;
padding:12px 32px;
border-radius:15px;
border:none;
cursor:pointer;
transition:transform .3s ease;
}

#yesBtn{
background:#d81b60;
color:white;
}

#noBtn{
background:gray;
color:white;
position:fixed;
}

.celebration{
position:fixed;
inset:0;
background:#ffd6e7;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
}

.love{
font-size:60px;
color:#d81b60;
animation:glow 1.2s infinite alternate;
margin-top:20px;
}

@keyframes glow{
from{ text-shadow:0 0 10px #ff5fa2;}
to{ text-shadow:0 0 35px #ff2f85;}
}

.firework{
position:absolute;
font-size:40px;
animation:explode 1.2s ease-out forwards;
}

@keyframes explode{
0%{transform:translate(0,0);opacity:1}
100%{transform:translate(var(--x),var(--y));opacity:0}
}
</style>
</head>

<body>

<div class="container">

<div id="bunny" class="bunny">🐰</div>

<div class="box">

<div class="question">
Joanne, will you be my Valentine? 💖
</div>

<div id="bubble" class="bubble"></div>

<div class="buttons">
<button id="yesBtn">Yes</button>
</div>

</div>

<button id="noBtn">No</button>

</div>

<div id="celebration" class="celebration">

<div class="bunny">🐰💃</div>
<div class="love">I Love You ❤️</div>

</div>

<script>

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const bubble = document.getElementById("bubble");
const bunny = document.getElementById("bunny");
const celebration = document.getElementById("celebration");

let scale = 1;
let index = 0;

const messages = [
 "Are you sure? 🥺",
 "Think again 💗",
 "Don't break my heart 😢",
 "One more chance?",
 "Please say yes 💕"
];

teleport();

function teleport(){
 const x = Math.random() * (window.innerWidth - 120);
 const y = Math.random() * (window.innerHeight - 80);
 noBtn.style.left = x + "px";
 noBtn.style.top = y + "px";
}

function onNo(){
 teleport();

 scale += 0.25;
 yesBtn.style.transform = `scale(${scale})`;

 bubble.textContent = messages[index % messages.length];
 index++;

 bunny.textContent="🐰😢";
}

noBtn.addEventListener("mouseover", onNo);
noBtn.addEventListener("touchstart", onNo);

yesBtn.onclick = () => {
 celebration.style.display="flex";

 for(let i=0;i<180;i++){
   fire();
 }
};

function fire(){
 const f = document.createElement("div");
 f.className="firework";
 f.innerText = Math.random()>0.5 ? "🎆" : "🎉";

 f.style.left = Math.random()*window.innerWidth+"px";
 f.style.top = Math.random()*window.innerHeight+"px";

 f.style.setProperty("--x",(Math.random()-0.5)*800+"px");
 f.style.setProperty("--y",(Math.random()-0.5)*800+"px");

 celebration.appendChild(f);

 setTimeout(()=>f.remove(),1200);
}

</script>

</body>
</html>
